<!doctype html><html><head><meta charset="utf-8"><style>
body{font:14px system-ui;width:310px;padding:16px;background:#07131b;color:#edf4f7}h1{font-size:19px}label{display:block;margin-top:12px}input{box-sizing:border-box;width:100%;padding:9px;margin-top:5px}button{padding:10px;margin-top:14px;width:100%;cursor:pointer}p{line-height:1.5}#status{white-space:pre-wrap}
</style></head><body><h1>Connect this Chrome profile</h1><p>Only the profile where this extension is installed will connect. Choose which sites Chrome allows it to access.</p>
<label>Profile name<input id="name" placeholder="Personal or Work"></label>
<label>JARVIS bridge port<input id="port" type="number" value="8766" min="1024" max="65535"></label>
<label>Pairing code from Workspace<input id="code" autocomplete="off"></label>
<button id="pair">Pair this profile and allow websites</button><button id="disconnect">Disconnect this profile</button><p id="status" role="status"></p><script src="popup.js"></script></body></html>
